name: Build and Publish Custom n8n Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

  schedule:
    - cron: '23 5 * * *'

  workflow_dispatch:
  
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image name to lowercase
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Detect n8n version
        id: n8n-version
        run: |
          docker pull n8nio/n8n:latest
          VERSION=$(docker run --rm --entrypoint n8n n8nio/n8n:latest --version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected n8n version: $VERSION"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Update README with n8n version
        env:
          N8N_VERSION: ${{ steps.n8n-version.outputs.version }}
          BUILD_DATE: ${{ github.run_started_at }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          version = os.environ["N8N_VERSION"]
          build_date = os.environ["BUILD_DATE"][:10]

          text = re.sub(
              r"<!-- N8N_VERSION -->.*?<!-- /N8N_VERSION -->",
              f"<!-- N8N_VERSION -->{version}<!-- /N8N_VERSION -->",
              text,
              count=1,
          )

          text = re.sub(
              r"<!-- BUILD_DATE -->.*?<!-- /BUILD_DATE -->",
              f"<!-- BUILD_DATE -->{build_date}<!-- /BUILD_DATE -->",
              text,
              count=1,
          )

          path.write_text(text)
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Update README with n8n version"
            git push
          else
            echo "README already up to date"
          fi
